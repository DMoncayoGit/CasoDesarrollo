<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Bootstrap -->
    <link href='https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/css/bootstrap.min.css' rel='stylesheet'>
    <!-- Enlace a las fuentes de Texto -->
    <link href='https://use.fontawesome.com/releases/v5.7.2/css/all.css' rel='stylesheet'>
    <!-- JS -->
    <script type='text/javascript' src='https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js'></script>
    <script type='text/javascript' src='https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/js/bootstrap.min.js'></script>
    <script type='text/javascript' src=''></script>
    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>

    <div class="wrapper bg-white">
        <div class="container" ><img src="recursos/img/logoUTI.png" alt="Logo" width="300" height="150"></div>
        <div class="h4 text-muted text-center pt-2">Ingresa tus datos</div>
        
        <form class="pt-3" action="recursos/login.php" method="POST" >
            <div class="form-group py-2">
                <div class="input-field"> 
                    <span class="far fa-user p-2"></span> 
                    <label for="username">Usuario:</label>
                    <input type="text" placeholder="Ingresa tu Email" id="username" name="username" required class=""> 
                </div>
            </div>
            <div class="form-group py-1 pb-2">
                <div class="input-field"> 
                    <span class="fas fa-lock p-2"></span> 
                    <label for="password">Contraseña:</label>
                    <input type="password" placeholder="Ingresa tu Contraseña" id="password" name="password" required class=""> 
                </div>
            </div>
                       
            <button type="submit" class="btn btn-block text-center my-3">Log in</button>
        
        </form>
    </div>
    <script type='text/javascript'></script>

</body>
</html>
